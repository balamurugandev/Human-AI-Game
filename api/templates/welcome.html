{% extends "base.html" %}
{% block content %}
<style>
  @keyframes pulse-human {
    0%,100% { filter: drop-shadow(0 0 6px #9b59b6) drop-shadow(0 0 14px #7c3aed); }
    50%      { filter: drop-shadow(0 0 16px #c084fc) drop-shadow(0 0 32px #9b59b6); }
  }
  @keyframes pulse-ai {
    0%,100% { filter: drop-shadow(0 0 6px #00d4ff) drop-shadow(0 0 14px #0891b2); }
    50%      { filter: drop-shadow(0 0 18px #67e8f9) drop-shadow(0 0 36px #00d4ff); }
  }
  @keyframes float-hero {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }
  .hero-human { animation: pulse-human 3s ease-in-out infinite; }
  .hero-ai    { animation: pulse-ai   2.6s ease-in-out infinite; }
  .hero-wrap  { animation: float-hero 5s ease-in-out infinite; }
  .main-title {
    font-size: clamp(2rem, 6vw, 3.6rem);
    font-weight: 900;
    letter-spacing: 6px;
    text-align: center;
    margin: 0 0 6px;
    background: linear-gradient(135deg, #a78bfa 20%, #e94560 50%, #00d4ff 80%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
</style>

<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center;
            justify-content:center; padding:32px 20px;
            background: radial-gradient(ellipse at 22% 40%, #2d1254 0%, transparent 55%),
                        radial-gradient(ellipse at 78% 40%, #051f4a 0%, transparent 55%),
                        var(--bg);">

  <p style="font-size:.82rem; letter-spacing:4px; text-transform:uppercase;
            color:var(--muted); margin-bottom:10px;">Can you tell the difference?</p>
  <h1 class="main-title">HUMAN &nbsp;vs&nbsp; A.I.</h1>
  <p style="color:var(--muted); font-size:.98rem; text-align:center; margin-bottom:30px;">
    Each round shows two images — pick the <strong style="color:#fff;">REAL photograph</strong>.
  </p>

  <!-- ── Hero SVG illustration ──────────────────────────────────────── -->
  <div class="hero-wrap" style="width:100%; max-width:700px; margin-bottom:32px;">
    <svg viewBox="0 0 700 195" xmlns="http://www.w3.org/2000/svg"
         style="width:100%; height:auto;" aria-hidden="true">
      <defs>
        <radialGradient id="hBg" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#7c3aed" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="aBg" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#0891b2" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
        </radialGradient>
        <filter id="gh">
          <feGaussianBlur stdDeviation="3.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="ga">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Glow halos -->
      <ellipse cx="170" cy="97" rx="155" ry="97" fill="url(#hBg)"/>
      <ellipse cx="530" cy="97" rx="155" ry="97" fill="url(#aBg)"/>

      <!-- ── HUMAN: stylised eye ──────────────────────────── -->
      <g class="hero-human">
        <!-- Head outline -->
        <path d="M 95,158 Q 93,118 90,92 Q 85,52 120,26
                 Q 145,12 170,12 Q 205,12 220,38
                 Q 235,58 230,92 Q 227,122 224,158 Z"
              fill="#1e1040" stroke="#7c3aed" stroke-width="1.5" filter="url(#gh)"/>
        <!-- Eyebrow -->
        <path d="M 105,69 Q 130,58 165,63"
              fill="none" stroke="#c084fc" stroke-width="2.8" stroke-linecap="round"/>
        <!-- Eye socket -->
        <ellipse cx="142" cy="87" rx="52" ry="32" fill="#120824" stroke="#9b59b6" stroke-width="1.5"/>
        <!-- Iris -->
        <circle cx="142" cy="87" r="21" fill="#6d28d9"/>
        <!-- Pupil -->
        <circle cx="142" cy="87" r="12" fill="#0d0618"/>
        <!-- Iris spokes -->
        <g opacity=".45" stroke="#a78bfa" stroke-width=".9">
          <line x1="142" y1="67" x2="142" y2="74"/>
          <line x1="142" y1="100" x2="142" y2="107"/>
          <line x1="122" y1="87" x2="129" y2="87"/>
          <line x1="155" y1="87" x2="162" y2="87"/>
          <line x1="128" y1="73" x2="133" y2="78"/>
          <line x1="152" y1="96" x2="157" y2="101"/>
        </g>
        <!-- Specular highlight -->
        <circle cx="149" cy="80" r="5" fill="white" opacity=".55"/>
        <circle cx="146" cy="84" r="2" fill="white" opacity=".28"/>
        <!-- HUMAN label -->
        <text x="162" y="178" text-anchor="middle" fill="#c084fc" font-size="17"
              font-weight="900" font-family="'Segoe UI',monospace" letter-spacing="5"
              filter="url(#gh)">HUMAN</text>
        <text x="162" y="192" text-anchor="middle" fill="#7c3aed" font-size="8.5"
              font-family="monospace" letter-spacing="2" opacity=".8">INTUITION · INSTINCT · FEELING</text>
      </g>

      <!-- ── CENTER VS ───────────────────────────────────── -->
      <line x1="350" y1="12" x2="350" y2="180"
            stroke="#e94560" stroke-width="1" stroke-dasharray="5 4" opacity=".45"/>
      <circle cx="350" cy="97" r="32" fill="#0f1e40" stroke="#e94560" stroke-width="2"/>
      <text x="350" y="105" text-anchor="middle" fill="#e94560" font-size="20"
            font-weight="900" font-family="monospace">VS</text>
      <!-- Tiny photo icon above VS circle -->
      <g transform="translate(333,55)">
        <rect width="34" height="26" rx="3" fill="#16213e" stroke="#a8a8b3" stroke-width="1.2"/>
        <rect x="2" y="2" width="30" height="18" rx="2" fill="#0f3460"/>
        <path d="M 2,15 L 9,9 L 17,14 L 23,7 L 32,15 Z" fill="#2e7d32" opacity=".85"/>
        <circle cx="23" cy="8" r="4" fill="#ffca28" opacity=".9"/>
      </g>

      <!-- ── AI: robot head ──────────────────────────────── -->
      <g class="hero-ai">
        <!-- Outer shell -->
        <rect x="447" y="20" width="127" height="138" rx="13"
              fill="#031222" stroke="#0891b2" stroke-width="1.8" filter="url(#ga)"/>
        <rect x="452" y="25" width="117" height="128" rx="10" fill="#041828" opacity=".8"/>
        <!-- Antenna -->
        <line x1="510" y1="20" x2="510" y2="5" stroke="#0891b2" stroke-width="2.5"/>
        <circle cx="510" cy="3" r="5" fill="#e94560">
          <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <!-- Scanner display -->
        <rect x="460" y="47" width="101" height="67" rx="7"
              fill="#020c18" stroke="#0891b2" stroke-width="1.2"/>
        <!-- Scanline -->
        <rect x="462" y="49" width="97" height="2" fill="#00d4ff" opacity=".6">
          <animate attributeName="y" from="49" to="112" dur="1.9s" repeatCount="indefinite"/>
        </rect>
        <!-- Targeting rings -->
        <circle cx="510" cy="81" r="25" fill="none" stroke="#0891b2" stroke-width="1.5" opacity=".8"/>
        <circle cx="510" cy="81" r="15" fill="none" stroke="#0891b2" stroke-width=".9" opacity=".6"/>
        <circle cx="510" cy="81" r="5"  fill="#00d4ff" opacity=".75"/>
        <!-- Crosshairs -->
        <line x1="485" y1="81" x2="505" y2="81" stroke="#00d4ff" stroke-width="1" opacity=".8"/>
        <line x1="515" y1="81" x2="535" y2="81" stroke="#00d4ff" stroke-width="1" opacity=".8"/>
        <line x1="510" y1="56" x2="510" y2="76" stroke="#00d4ff" stroke-width="1" opacity=".8"/>
        <line x1="510" y1="86" x2="510" y2="106" stroke="#00d4ff" stroke-width="1" opacity=".8"/>
        <!-- Corner brackets -->
        <path d="M 462,49 l 0,8 M 462,49 l 10,0" stroke="#00d4ff" stroke-width="1.4" opacity=".7"/>
        <path d="M 559,49 l 0,8 M 559,49 l -10,0" stroke="#00d4ff" stroke-width="1.4" opacity=".7"/>
        <path d="M 462,114 l 0,-8 M 462,114 l 10,0" stroke="#00d4ff" stroke-width="1.4" opacity=".7"/>
        <path d="M 559,114 l 0,-8 M 559,114 l -10,0" stroke="#00d4ff" stroke-width="1.4" opacity=".7"/>
        <!-- Pixel mouth -->
        <rect x="470" y="127" width="81" height="16" rx="4" fill="#020c18" stroke="#0891b2" stroke-width="1"/>
        <rect x="474" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".85"/>
        <rect x="486" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".35"/>
        <rect x="498" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".85"/>
        <rect x="510" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".25"/>
        <rect x="522" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".85"/>
        <rect x="534" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".5"/>
        <rect x="546" y="131" width="9" height="8" rx="1" fill="#00d4ff" opacity=".85"/>
        <!-- Side ports -->
        <line x1="447" y1="70" x2="436" y2="70" stroke="#0891b2" stroke-width="1.5" opacity=".7"/>
        <circle cx="433" cy="70" r="4" fill="#00d4ff" opacity=".7">
          <animate attributeName="opacity" values=".7;.1;.7" dur=".95s" repeatCount="indefinite"/>
        </circle>
        <line x1="574" y1="70" x2="585" y2="70" stroke="#0891b2" stroke-width="1.5" opacity=".7"/>
        <circle cx="588" cy="70" r="4" fill="#00d4ff" opacity=".7">
          <animate attributeName="opacity" values=".1;.7;.1" dur=".95s" repeatCount="indefinite"/>
        </circle>
        <!-- A.I. label -->
        <text x="510" y="178" text-anchor="middle" fill="#00d4ff" font-size="17"
              font-weight="900" font-family="'Segoe UI',monospace" letter-spacing="8"
              filter="url(#ga)">A.I.</text>
        <text x="510" y="192" text-anchor="middle" fill="#0891b2" font-size="8.5"
              font-family="monospace" letter-spacing="2" opacity=".8">LOGIC · PATTERN · DATA</text>
      </g>
    </svg>
  </div>
  <!-- ── End Hero SVG ───────────────────────────────────────────────── -->

  <!-- Registration card -->
  <div class="card" style="width:100%; max-width:460px;">
    {% if errors %}
    <div class="error-box">
      {% for e in errors %}<p>{{ e }}</p>{% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="/start" autocomplete="off">
      <label class="field-label" style="margin-top:0;">Your Name</label>
      <input class="text-input" type="text" name="name"
             value="{{ name or '' }}" placeholder="e.g. Jane Smith" autofocus required>

      <div style="display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;">
        <button type="submit" class="btn btn-primary"
                style="font-size:1.05rem; padding:14px 40px; flex:1; min-width:140px;">
          &#9654;&nbsp; START
        </button>
        <a href="/leaderboard" class="btn btn-secondary"
           style="padding:14px 24px; flex:1; min-width:140px; text-align:center;">
          &#127942;&nbsp; Leaderboard
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
