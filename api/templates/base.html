<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human vs AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #1a1a2e;
      --bg2:      #16213e;
      --bg3:      #0f3460;
      --accent:   #e94560;
      --muted:    #a8a8b3;
      --green:    #4caf50;
      --green-dk: #2e7d32;
      --red:      #c62828;
      --red-dk:   #4a0d0d;
      --white:    #ffffff;
      --yellow:   #ffca28;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 28px;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      text-decoration: none;
      line-height: 1;
      white-space: nowrap;
    }
    .btn:hover  { opacity: .85; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .38; cursor: not-allowed; pointer-events: none; }

    .btn-primary   { background: var(--accent);  color: var(--white); }
    .btn-secondary { background: var(--bg3);     color: var(--muted); }
    .btn-danger    { background: var(--red-dk);  color: #ff6b6b; }
    .btn-green     { background: var(--green-dk);color: var(--white); }

    /* ── Form inputs ─────────────────────────────────────────────────────── */
    .field-label {
      display: block;
      color: var(--muted);
      font-size: .9rem;
      margin: 16px 0 6px;
    }
    .text-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg3);
      border: 2px solid transparent;
      border-radius: 7px;
      color: var(--white);
      font-size: 16px;
      outline: none;
      transition: border-color .2s;
    }
    .text-input:focus { border-color: var(--accent); }

    /* ── Error box ───────────────────────────────────────────────────────── */
    .error-box {
      background: #4a0d0d;
      border: 1px solid var(--accent);
      border-radius: 7px;
      padding: 12px 16px;
      color: #ff9090;
      margin-bottom: 16px;
      font-size: .95rem;
    }
    .error-box p { margin: 2px 0; }

    /* ── Card ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--bg2);
      border-radius: 12px;
      padding: 28px 32px;
    }

    /* ── Top navigation bar ──────────────────────────────────────────────── */
    .top-bar {
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .top-bar .round-label { font-size: 1.05rem; font-weight: 700; }
    .top-bar .timer       { font-size: 1rem;    color: var(--yellow); font-variant-numeric: tabular-nums; }
    .top-bar .score-label { font-size: 1rem;    color: var(--accent); }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
